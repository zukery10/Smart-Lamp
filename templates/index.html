<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>

<body class="section">
  <div class="columns">
    <div class="column content has-text-centered">
      <h1>Last Visitor</h1>
    
      <figure class="image has-text-centered">
        <img src='{{pic}}' style="width: 600px; height: auto;" />
      </figure>
    </div>

    <div class="column content has-text-centered">
      <h1>Movement Log</h1>


      <pre>{{ content }}</pre>
    </div>
  </div>
</body>

</html>
